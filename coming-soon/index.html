<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spine | Coming soon</title>
<meta name="description" content="Spine is an AI project manager that makes sure good AI ideas and questions never quietly die.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-24 0 184 184'%3E%3Crect x='36' y='0' width='95' height='40' rx='20' fill='%231660FF'/%3E%3Crect x='8' y='72' width='127' height='40' rx='20' fill='%231660FF'/%3E%3Crect x='0' y='144' width='79' height='40' rx='20' fill='%231660FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F7F8FA; --border:#E6E8EE; --text:#0F1733; --muted:#6B7387; --brand:#1660FF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  header { padding: 28px 32px; }
  .logo { display: inline-flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; }
  .wrap { max-width: 640px; text-align: center; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand); }
  h1 { margin-top: 16px; font-size: clamp(32px, 6vw, 52px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; }
  p { margin-top: 20px; font-size: 17px; line-height: 1.6; color: var(--muted); }
  .film { margin-top: 40px; width: 100%; max-width: 960px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #0F1733; }
  .film video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
  footer { padding: 24px 32px; font-size: 13px; color: var(--muted); text-align: center; }
  @media (max-width: 600px) { header { padding: 20px 16px; } }
</style>
</head>
<body>
  <header>
    <span class="logo">
      <svg width="25" height="34" viewBox="0 0 135 184" aria-hidden="true">
        <rect x="36" y="0" width="95" height="40" rx="20" fill="#1660FF"/>
        <rect x="8" y="72" width="127" height="40" rx="20" fill="#1660FF"/>
        <rect x="0" y="144" width="79" height="40" rx="20" fill="#1660FF"/>
      </svg>
      Spine
    </span>
  </header>
  <main>
    <div class="wrap">
      <div class="label">Coming soon</div>
      <h1>Good AI ideas should never quietly die.</h1>
      <p>Spine is the AI project manager for your company. It makes sure every AI question gets answered and every good idea gets an owner, a team and a plan.</p>
    </div>
    <div class="film">
      <video src="/trailer.mp4" poster="/poster.jpg" controls playsinline preload="metadata"></video>
    </div>
  </main>
  <footer>&copy; <span id="y">2026</span> Spine</footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
